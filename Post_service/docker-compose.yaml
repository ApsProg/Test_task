services:

  callbacks-service:
    build:
      context: ./callbacks-service
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    env_file:
      - ./callbacks-service/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - kafka

  callbacks-consumer:
    build:
      context: ./callbacks-service
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "src.workers.consumer"
      ]
    env_file:
      - ./callbacks-service/.env
    depends_on:
      - postgres
      - kafka

  callbacks-publisher:
    build:
      context: ./callbacks-service
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "src.workers.publisher"
      ]
    env_file:
      - ./callbacks-service/.env
    depends_on:
      - postgres
      - kafka